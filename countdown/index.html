<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Countdown</title>
    <style>
        /* CSS Variables handle the perfect scaling for desktop vs mobile */
        :root {
            --digit-w: 55px;
            --digit-h: 80px;
            --digit-font: 3.5rem;
            --bg-color: #0a0a0a;
            --card-top: #2a2a2a;
            --card-bot: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .clock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .group {
            display: flex;
            gap: 4px;
        }

        .colon {
            font-size: var(--digit-font);
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* --- 3D DIGIT CONTAINER --- */
        .digit {
            position: relative;
            width: var(--digit-w);
            height: var(--digit-h);
            background-color: #000;
            border-radius: 6px;
            font-size: var(--digit-font);
            font-weight: bold;
            color: #f0f0f0;
            box-shadow: 0 8px 15px rgba(0,0,0,0.9);
            perspective: 1000px; /* Crucial for 3D depth */
        }

        /* --- CARD HALVES --- */
        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: var(--card-top);
            overflow: hidden;
            text-align: center;
            border-radius: 6px;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .half-top {
            top: 0;
            line-height: var(--digit-h);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            transform-origin: bottom;
            background: linear-gradient(to bottom, #333 0%, #1a1a1a 100%);
        }

        .half-bottom {
            bottom: 0;
            line-height: 0;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            transform-origin: top;
            background: linear-gradient(to bottom, #1a1a1a 0%, #111 100%);
        }

        /* The physical mechanical hinge */
        .digit::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -2px;
            width: calc(100% + 4px);
            height: 2px;
            background-color: #000;
            transform: translateY(-50%);
            z-index: 10;
        }

        /* --- THE 3D FLIP ANIMATIONS --- */
        .flap-top {
            z-index: 5;
            animation: flipTop 0.25s ease-in forwards;
        }

        .flap-bottom {
            z-index: 5;
            transform: rotateX(90deg); /* Starts folded up, invisible */
            animation: flipBottom 0.25s ease-out 0.25s forwards;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); filter: brightness(1); }
            100% { transform: rotateX(-90deg); filter: brightness(0.2); } /* Folds down and gets shadowed */
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); filter: brightness(0.2); }
            100% { transform: rotateX(0deg); filter: brightness(1); }
        }

        /* --- LABELS --- */
        .labels {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .label { width: calc((var(--digit-w) * 2) + 4px); text-align: center; font-size: 0.8rem; color: #666; letter-spacing: 2px; }
        .label-days { width: calc((var(--digit-w) * 4) + 12px); text-align: center; font-size: 0.8rem; color: #666; letter-spacing: 2px; }
        .colon-space { width: 15px; }

        .back-btn { margin-top: 50px; padding: 10px 20px; background-color: #000; color: #dcdcdc; text-decoration: none; border: 1px solid #333; border-radius: 5px; transition: 0.3s; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            :root {
                --digit-w: 30px;
                --digit-h: 45px;
                --digit-font: 1.8rem;
            }
            .clock { gap: 6px; }
            .labels { gap: 6px; }
            .colon-space { width: 8px; }
        }
    </style>
</head>
<body>

    <div class="clock">
        <div class="group">
            <div class="digit" id="d-thou" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="d-hund" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="d-tens" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="d-ones" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
        </div>
        
        <div class="colon">:</div>
        
        <div class="group">
            <div class="digit" id="h-tens" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="h-ones" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
        </div>

        <div class="colon">:</div>
        
        <div class="group">
            <div class="digit" id="m-tens" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="m-ones" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
        </div>

        <div class="colon">:</div>
        
        <div class="group">
            <div class="digit" id="s-tens" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
            <div class="digit" id="s-ones" data-value="0"><div class="half half-top static-top">0</div><div class="half half-bottom static-bottom">0</div></div>
        </div>
    </div>

    <div class="labels">
        <div class="label-days">DAYS</div>
        <div class="colon-space"></div>
        <div class="label">HRS</div>
        <div class="colon-space"></div>
        <div class="label">MINS</div>
        <div class="colon-space"></div>
        <div class="label">SECS</div>
    </div>

    <a href="/" class="back-btn">RETURN TO DATABASE</a>

    <script>
        // ==============================================================
        // TARGET DATE
        // ==============================================================
        const TARGET_DATE = "2029-02-09T00:00:00"; 

        let isFirstLoad = true;

        function splitNum(num) { return String(num).padStart(2, '0').split(''); }
        function splitDays(num) { return String(num).padStart(4, '0').split(''); }

        // The core physics engine of the flip
        function flipTo(id, newValue) {
            const el = document.getElementById(id);
            const currentValue = el.getAttribute('data-value');

            // If it's the very first page load, just set the numbers silently without animating
            if (isFirstLoad) {
                el.setAttribute('data-value', newValue);
                el.querySelector('.static-top').innerText = newValue;
                el.querySelector('.static-bottom').innerText = newValue;
                return;
            }

            if (currentValue === String(newValue)) return;

            el.setAttribute('data-value', newValue);

            const staticTop = el.querySelector('.static-top');
            const staticBottom = el.querySelector('.static-bottom');

            // Create the top half that falls forward
            const flapTop = document.createElement('div');
            flapTop.className = 'half half-top flap-top';
            flapTop.innerText = currentValue;

            // Create the bottom half that catches the fall
            const flapBottom = document.createElement('div');
            flapBottom.className = 'half half-bottom flap-bottom';
            flapBottom.innerText = newValue;

            // Change background top instantly
            staticTop.innerText = newValue;

            el.appendChild(flapTop);
            el.appendChild(flapBottom);

            // Wait exactly 500ms for both 0.25s CSS animations to finish, then clean up
            setTimeout(() => {
                staticBottom.innerText = newValue;
                flapTop.remove();
                flapBottom.remove();
            }, 500); 
        }

        function updateDisplay() {
            const targetTime = new Date(TARGET_DATE).getTime();
            const now = new Date().getTime();
            const difference = targetTime - now;

            let d = 0, h = 0, m = 0, s = 0;

            if (difference > 0) {
                d = Math.floor(difference / (1000 * 60 * 60 * 24));
                h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                s = Math.floor((difference % (1000 * 60)) / 1000);
            }

            const [dThou, dHund, dTens, dOnes] = splitDays(d);
            const [hTens, hOnes] = splitNum(h);
            const [mTens, mOnes] = splitNum(m);
            const [sTens, sOnes] = splitNum(s);

            flipTo('d-thou', dThou);
            flipTo('d-hund', dHund);
            flipTo('d-tens', dTens);
            flipTo('d-ones', dOnes);
            
            flipTo('h-tens', hTens);
            flipTo('h-ones', hOnes);
            
            flipTo('m-tens', mTens);
            flipTo('m-ones', mOnes);
            
            flipTo('s-tens', sTens);
            flipTo('s-ones', sOnes);

            isFirstLoad = false;
        }

        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>

</body>
</html>
